[package]
name = "monitor-switcher"
version = "0.1.0"
edition = "2021"
# The project's own source. A build with the `cec` feature links libCEC and is
# covered by the GPL instead; see the note on that feature below.
license = "MIT"

# The console CLI and the tray daemon need opposite Windows subsystems, which
# is a property of a binary rather than of the code, so the code lives in a
# library and each binary is a thin entry point into it.
[lib]
name = "monitor_switcher"
path = "src/lib.rs"

[[bin]]
name = "monitor-switcher"
path = "src/main.rs"

# GUI subsystem: no console, so nothing flashes when Windows starts it at
# sign-in. That is the whole reason the two are separate binaries.
[[bin]]
name = "monitor-switcher-tray"
path = "src/tray_main.rs"

[features]
# Off by default on purpose. libCEC is GPL-2.0-or-later, so a build with this
# feature produces a binary covered by the GPL, while the default build links
# nothing but permissively licensed crates and needs no libCEC installed.
default = []
cec = ["dep:libcec"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libcec = { version = "8.1.7", optional = true }

[build-dependencies]
# Used only to locate the MSVC tools that generate libCEC's import library,
# and only when the `cec` feature is on.
cc = "1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Input_KeyboardAndMouse",
    # The tray icon, its menu, and the rest of its small world.
    "Win32_UI_Shell",                 # Shell_NotifyIconW, ShellExecuteW
    "Win32_UI_WindowsAndMessaging",   # the window, its messages and its menu
    "Win32_System_LibraryLoader",     # GetModuleHandleW
    "Win32_Security",                 # SECURITY_ATTRIBUTES, in CreateMutexW
    "Win32_System_Threading",         # the single-instance mutex
    "Win32_System_Registry",          # the start-at-sign-in toggle
    "Win32_System_Com",               # an apartment for ShellExecuteW
    "Win32_System_SystemInformation", # GetLocalTime, for log timestamps
]
